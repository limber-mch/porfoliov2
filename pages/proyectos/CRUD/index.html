<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="section-form">
        <h2>Registro de Usuarios</h2>

        <form class="formulario-usuario" id="formUsuario">
            <div class="form-data">
                <label for="nombre">Nombre</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    required
                    >
            </div>
            <div class="form-data">
                <label for="apellido">Apellido</label>
                <input 
                    type="text" 
                    id="apellido" 
                    name="apellido"
                    required
                    >
            </div>
             <div class="form-data">
                <label for="correo">Correo</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    required
                    >
            </div>
            <div class="form-data">
                <label for="telefono">Telefono</label>
                <input 
                    type="text" 
                    id="telefono" 
                    name="telefono"
                    required
                    >
            </div>
            <div class="form-data">
                <label for="telefono">Edad</label>
                <input 
                    type="number" 
                    id="edad" 
                    name="edad"
                    required
                    >
            </div>
            <div class="form-data">
                <label for="genero">Genero</label>
                <select name="genero" id="genero">
                    <option value="">Seleccione .....</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                </select>
            </div>
            <div class="form-data">
                <label for="direccion">Dirección</label>
                <textarea 
                    id="direccion" 
                    name="direccion" 
                    rows="3">
                    </textarea>
            </div>

            <div class="form-actions">
                <button type="submit">Enviar</button>
                <button type="reset">Limpiar</button>
            </div>
        </form>
    </section>

    <section class="section-usuarios">
        <table border="1" width="100%" id="tablaUsuarios">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Edad</th>
                    <th>Género</th>
                    <th>Dirección</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

            </tbody>
        </table>

    </section>

    <script src="js/app.js"></script>
</body>
</html>
